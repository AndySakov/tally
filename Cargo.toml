[package]
name = "tally"
version = "0.1.0"
edition = "2024"

[dependencies]
crc-fast = { version = "1.10.0", default-features = false, features = ["std"] }
crc32c = "0.6.9"
log = "0.4.35"
siphasher = "1.0.4"
xorf = { version = "0.13.0", default-features = false, features = ["binary-fuse"] }

[target.'cfg(fuzzing)'.dependencies]
arbitrary = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"
tempfile = "3.27.0"

[[bench]]
name = "store"
harness = false

[[test]]
name = "kill"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
